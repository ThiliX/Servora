# Servora local development stack.
# M0 scope: only the infrastructure every later milestone depends on.
# Application services are added in the milestone that introduces them.
name: servora

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SERVORA_POSTGRES_DB:-servora}
      POSTGRES_USER: ${SERVORA_POSTGRES_OWNER_USER:-servora_owner}
      POSTGRES_PASSWORD: ${SERVORA_POSTGRES_OWNER_PASSWORD:?Set SERVORA_POSTGRES_OWNER_PASSWORD in .env}
    ports:
      # Loopback only; never publish the database on all interfaces.
      - "127.0.0.1:${SERVORA_POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVORA_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
