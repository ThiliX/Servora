[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servora-ai"
version = "0.1.0"
description = "Servora AI service: tenant-filtered retrieval and grounded answers"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "psycopg[binary]==3.3.9",
    "PyJWT==2.15.1",
    "anthropic==2.9.0",
    "google-genai==3.4.0",
]

[project.optional-dependencies]
# The real embedding model. Kept optional so tests and linting do not need PyTorch.
model = ["sentence-transformers==6.3.0"]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "testcontainers==4.15.0",
    "ruff==0.17.5",
]

[tool.setuptools.packages.find]
include = ["servora_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
