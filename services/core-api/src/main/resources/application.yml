spring:
  application:
    name: servora-core-api
  config:
    # Local development: read the repository's .env, whether started from the repository root
    # or from services/core-api. Real deployments set environment variables instead.
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    # Runtime role: owns no tables and cannot bypass Row-Level Security.
    url: jdbc:postgresql://${SERVORA_POSTGRES_HOST:localhost}:${SERVORA_POSTGRES_PORT:5432}/${SERVORA_POSTGRES_DB:servora}
    username: ${SERVORA_POSTGRES_APP_USER:servora_app}
    password: ${SERVORA_POSTGRES_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${SERVORA_POSTGRES_POOL_SIZE:10}
  flyway:
    # Owner role: runs migrations only.
    user: ${SERVORA_POSTGRES_OWNER_USER:servora_owner}
    password: ${SERVORA_POSTGRES_OWNER_PASSWORD}
    placeholders:
      app_role: ${SERVORA_POSTGRES_APP_USER:servora_app}
      worker_role: ${SERVORA_POSTGRES_WORKER_USER:servora_worker}
      ai_role: ${SERVORA_POSTGRES_AI_USER:servora_ai}
  data:
    redis:
      # Shared rate-limit counters.
      host: ${SERVORA_REDIS_HOST:localhost}
      port: ${SERVORA_REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      # Hard transport limit. The application applies its own, lower, limit and a content check.
      max-file-size: 12MB
      max-request-size: 13MB

server:
  port: ${SERVORA_API_PORT:8080}
  forward-headers-strategy: none
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

servora:
  auth:
    issuer: servora-core-api
    # Base64-encoded HMAC key, at least 32 bytes after decoding.
    jwt-secret: ${SERVORA_JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P14D
    verification-token-ttl: PT24H
    invitation-ttl: P7D
    refresh-cookie-secure: ${SERVORA_REFRESH_COOKIE_SECURE:true}
    login-max-failures: 5
    login-failure-window: PT15M
  web:
    base-url: ${SERVORA_WEB_BASE_URL:http://localhost:5173}
  knowledge:
    max-upload-bytes: ${SERVORA_MAX_UPLOAD_BYTES:10485760}
    max-documents-per-workspace: 200
    uploads-per-hour: 60
  storage:
    # Private S3-compatible object storage for uploaded documents.
    endpoint: ${SERVORA_STORAGE_ENDPOINT:http://localhost:7070}
    region: ${SERVORA_STORAGE_REGION:us-east-1}
    bucket: ${SERVORA_STORAGE_BUCKET:servora-documents}
    access-key: ${SERVORA_STORAGE_ACCESS_KEY}
    secret-key: ${SERVORA_STORAGE_SECRET_KEY}
  ingestion:
    enqueue-url: ${SERVORA_WORKER_ENQUEUE_URL:http://localhost:8090/internal/v1/ingestion-jobs}
    # Base64 HMAC key shared with the document worker, at least 32 bytes. Not the user JWT key.
    token-secret: ${SERVORA_INTERNAL_TOKEN_SECRET}
    token-ttl: PT1M
    request-timeout: PT5S
  ai:
    # The AI service's internal answer endpoint. Calls are signed with the internal token key.
    answer-url: ${SERVORA_AI_ANSWER_URL:http://localhost:8091/internal/v1/answers}
    request-timeout: PT100S
    tests-per-hour: 60
  widget:
    # Base64 HMAC key for widget session tokens, at least 32 bytes. Must differ from the user JWT key.
    token-secret: ${SERVORA_WIDGET_TOKEN_SECRET}
    token-ttl: PT2H
    # The origin serving the widget iframe; conversation endpoints accept browser calls only from it.
    app-origin: ${SERVORA_WIDGET_APP_ORIGIN:http://localhost:5174}
    reply-timeout: PT100S
    config-per-ip-per-minute: 120
    sessions-per-ip-per-hour: 30
    messages-per-conversation-per-minute: 10
    messages-per-ip-per-minute: 30
    ai-replies-per-tenant-per-day: 2000
  outbox:
    enabled: true
    poll-interval: PT2S
    max-attempts: 8
    retry-base-delay: PT5S
  mail:
    # Development only: write verification and invitation links to the log
    # instead of sending email. Never enable outside local development.
    log-links: ${SERVORA_MAIL_LOG_LINKS:false}

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-}]"
