# Public demo only. Requests reach the gateways through Tailscale Funnel on the same machine, which
# Docker forwards from its bridge network, and Funnel adds the visitor's address to X-Forwarded-For.
# Without this, every visitor would share one address and one set of rate limits. The public ports
# stay bound to 127.0.0.1, so nothing else on the network can send these headers to the gateways.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
# The last address: the one Funnel added, not one the visitor sent.
real_ip_recursive off;
