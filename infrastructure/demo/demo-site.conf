# The two made-up customer websites (apps/widget/demo) that embed the widget in the public demo:
# /techstore/ and /hotelpro/. Both are allowed websites of their workspace's widget.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Behind Funnel the public port differs from 8080, so redirects stay relative.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /techstore/;
    }

    # The development server script is not part of the websites.
    location ~ \.mjs$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
