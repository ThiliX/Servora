# Prometheus scrape configuration for development, where the core API runs on the host
# (./mvnw spring-boot:run) and the other services in containers. Used by compose.observability.yml
# when SERVORA_PROMETHEUS_CONFIG=dev, the default (ADR-022).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API on the host: its management port, 8081 by default.
  - job_name: core-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: ai-service
    static_configs:
      - targets: ["ai-service:8091"]

  - job_name: worker-api
    static_configs:
      - targets: ["worker-api:8090"]

  - job_name: document-worker
    static_configs:
      - targets: ["document-worker:9100"]
