name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  core-api:
    name: Core API (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Integration tests start PostgreSQL (pgvector) through Testcontainers and run with RLS enabled.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  web:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  document-worker:
    name: Document worker (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/document-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/document-worker/pyproject.toml
      # The dev extra excludes PyTorch: tests use a deterministic fake embedder.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Starts PostgreSQL (pgvector) through Testcontainers, applies the core API migrations and
      # runs the pipeline as the unprivileged worker role.
      - run: pytest -q

  ai-service:
    name: AI service (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      # The dev extra excludes PyTorch: tests use a deterministic fake embedder and a fake LLM
      # provider, so no model is downloaded and no paid call is made.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Starts PostgreSQL (pgvector) through Testcontainers, applies the core API migrations and
      # runs retrieval as the read-only AI role.
      - run: pytest -q

  compose:
    name: Validate and start Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i "s/^SERVORA_POSTGRES_OWNER_PASSWORD=.*/SERVORA_POSTGRES_OWNER_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          sed -i "s/^SERVORA_POSTGRES_APP_PASSWORD=.*/SERVORA_POSTGRES_APP_PASSWORD=ci-$(openssl rand -hex 12)/" .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      # Builds the worker and AI service images; they share the layers holding the embedding model.
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for health
        run: docker compose up -d --wait --wait-timeout 300
      - name: Verify pgvector extension
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U servora_owner -d servora \
            -c "CREATE EXTENSION IF NOT EXISTS vector; SELECT extversion FROM pg_extension WHERE extname = 'vector';"
      - name: Verify the runtime roles are unprivileged
        run: |
          result=$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U servora_owner -d servora -Atc "SELECT rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname = 'servora_app'")
          test "$result" = "f"
          result=$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U servora_owner -d servora -Atc "SELECT rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname = 'servora_worker'")
          test "$result" = "f"
          result=$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U servora_owner -d servora -Atc "SELECT rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname = 'servora_ai'")
          test "$result" = "f"
      - name: Verify the worker API is healthy
        run: curl --fail --silent http://127.0.0.1:8090/health
      - name: Verify the AI service is healthy
        run: curl --fail --silent http://127.0.0.1:8091/health
      - name: Verify Redis
        run: docker compose exec -T redis redis-cli ping
      - name: Stop stack
        if: always()
        run: docker compose down -v
