name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "**/*.md"

  core-api:
    name: Core API (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Integration tests start PostgreSQL (pgvector) through Testcontainers and run with RLS enabled.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

  web:
    name: Dashboard (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  widget:
    name: Chat widget (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/widget
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/widget/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  document-worker:
    name: Document worker (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/document-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/document-worker/pyproject.toml
      # The dev extra excludes PyTorch: tests use a deterministic fake embedder.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Starts PostgreSQL (pgvector) through Testcontainers, applies the core API migrations and
      # runs the pipeline as the unprivileged worker role.
      - run: pytest -q
      # Known vulnerabilities in the installed dependencies. The package itself is local.
      - run: pip install pip-audit==2.7.3 && pip-audit --skip-editable --progress-spinner off

  ai-service:
    name: AI service (lint and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ai-service/pyproject.toml
      # The dev extra excludes PyTorch: tests use a deterministic fake embedder and a fake LLM
      # provider, so no model is downloaded and no paid call is made.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Starts PostgreSQL (pgvector) through Testcontainers, applies the core API migrations and
      # runs retrieval as the read-only AI role.
      - run: pytest -q
      # Known vulnerabilities in the installed dependencies. The package itself is local.
      - run: pip install pip-audit==2.7.3 && pip-audit --skip-editable --progress-spinner off

  e2e-typecheck:
    # The browser suite needs the whole stack and runs locally for now (tests/e2e/README.md); this
    # keeps it compiling until it runs in CI.
    name: Browser tests (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  security:
    name: Secret and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so a secret committed and later removed is still found.
          fetch-depth: 0
      # Tools run from pinned images rather than third-party actions.
      - name: Scan the history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner
      - name: Scan dependencies for known vulnerabilities
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 fs --quiet --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Shipped dependencies only. Development tooling advisories are triaged in docs/security.
      - name: Audit the dashboard's production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Audit the widget's production dependencies
        working-directory: apps/widget
        run: npm audit --omit=dev --audit-level=high

  production:
    # The production profile (compose.prod.yml) built from this commit: images scanned, then the MVP
    # demonstration script run against it in a browser.
    name: Production stack (scan, browser tests)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p servora-prod -f docker-compose.yml -f compose.prod.yml
      # The fake model: deterministic answers and no calls to a provider.
      SERVORA_LLM_PROVIDER: fake
      # Lets the browser tests read verification and invitation links from the API log. CI only.
      SERVORA_PROD_MAIL_LOG_LINKS: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Create a CI environment file with random secrets
        run: bash infrastructure/ci/make-env.sh
      - name: Validate Compose configuration
        run: $COMPOSE config --quiet
      - name: Build images
        run: $COMPOSE build
      - name: Scan images for known vulnerabilities
        run: |
          for image in servora/core-api:prod servora/web:prod servora/widget:prod servora/ai-service:dev servora/document-worker:dev; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --quiet \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Start the stack and wait for health
        run: $COMPOSE up -d --wait --wait-timeout 300
      - name: Verify the runtime roles are unprivileged
        run: |
          for role in servora_app servora_worker servora_ai; do
            result=$($COMPOSE exec -T postgres psql -v ON_ERROR_STOP=1 -U servora_owner -d servora -Atc \
              "SELECT rolsuper OR rolbypassrls OR rolcreaterole OR rolcreatedb FROM pg_roles WHERE rolname = '$role'")
            test "$result" = "f"
          done
      - name: Verify the API holds no owner password and only the gateway and widget publish ports
        run: |
          test "$($COMPOSE exec -T core-api bash -c 'env | grep -c OWNER_PASSWORD || true')" = "0"
          published=$($COMPOSE ps --format '{{.Service}} {{.Ports}}' | grep -- '->' | awk '{print $1}' | sort | tr '\n' ' ')
          test "$published" = "web widget "
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install the browser tests
        working-directory: tests/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the demonstration script against the production stack
        working-directory: tests/e2e
        env:
          E2E_TARGET: prod
          E2E_COMPOSE_PROJECT: servora-prod
        run: npx playwright test
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
