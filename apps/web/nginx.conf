# Dashboard and API gateway. Listens on 8080 inside the container as a non-root user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's DNS, so the core API's address is looked up per request rather than once at start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://core-api:8080;

    # Headers for the dashboard's own pages. API responses carry the API's stricter headers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaces, never appends: a client cannot pass its own address through the proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Traces start at the API (ADR-022): a client cannot pick trace IDs, force sampling or inject
        # baggage into log fields.
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_set_header Connection "";
        # Answers stream as server-sent events, and can take as long as the model does.
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 13m;
        # The API sets its own, stricter, security headers. Any add_header in this block stops the
        # dashboard's headers above from being added to API responses as well.
        add_header X-Served-By "servora-gateway" always;
    }

    # Built assets have content hashes in their names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routes all load the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
