# Widget host. Listens on 8080 inside the container as a non-root user.
#
# Serves the loader websites embed and the iframe page, and forwards the public widget API to the
# core API, so a website needs only the loader's URL and the iframe talks only to its own origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api http://core-api:8080;

    # Only the public widget endpoints. Dashboard and authentication endpoints are not reachable here.
    location /api/v1/public/ {
        proxy_pass $core_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaces, never appends: a client cannot pass its own address through the proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Answers stream as server-sent events, and can take as long as the model does.
        proxy_buffering off;
        proxy_read_timeout 120s;
        client_max_body_size 64k;
        # The API sets its own security and CORS headers.
        add_header X-Served-By "servora-widget-host" always;
    }

    # Fetched as a module script by customers' websites, so it needs CORS. It keeps a stable name,
    # so browsers must check for a newer version.
    location = /servora-widget.js {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The iframe page. Any website may frame it: the allowed websites are enforced by the API, which
    # refuses configuration and sessions to other origins. The page talks only to this origin.
    location = /widget.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors http: https:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
